# Checks the repository on every push to main and on every pull request.
name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Manifest, documentation and language parity
        run: python -I tools/ci_validate.py
      - name: Pictures of the README
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes

  tests:
    name: Tests, lint and the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and the debug APK
        run: ./gradlew check assembleDebug --no-daemon
      - name: Keep the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: eh3d-android-control-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
