# Checks the repository on every push to main and on every pull request.
name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow; the reference is a full
  # commit, so a change there reaches this repository only when this line is moved.
  validate:
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@4610941ddec34b44f54073f0f0acf1ccd1b9ae48
    with:
      python-version: "3.12"
      check-pictures: true
      run-tool-tests: false

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: The change has a line in the CHANGELOG
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  shared-cases:
    name: Case files shared with the iPhone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Case files shared with the iPhone app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -I tools/test_check_shared_cases.py
          python -I tools/check_shared_cases.py

  tests:
    name: Tests, lint and the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Tests, lint and the debug APK
        run: ./gradlew check assembleDebug assembleRelease --no-daemon
      - name: The release keeps what the libraries make by reflection
        run: python3 tools/check_release_build.py
      - name: Keep the debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: eh3d-android-control-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
