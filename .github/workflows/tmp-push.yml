name: tmp-push
on:
  push:
    branches: [push-notifications]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Test, lint, release build and notices
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > app/build/runtime-deps.txt
          python3 -I tools/third_party_notices.py app/build/runtime-deps.txt
          mkdir out
          cp docs/THIRD_PARTY_NOTICES out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: out
          path: out/
